# 本文件只负责在本机拉起 Neo4j 5.26（浏览器 7474，Bolt 7687）。
# 应用代码与 Flask 不在容器里跑。
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting Neo4j}"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
