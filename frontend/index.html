<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于中草药知识图谱的 Graph-RAG 问答系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --pine: #3D6A4F;
            --pine-hover: #345A44;
            --ochre: #8A6D4B;
            --moss: #D8E4DC;
            --paper: #FCFAF5;
            --card: #FFFEF9;
            --ink: #333333;
            --muted: #666666;
            --line: #E6E1D6;
            --highlight: #F3E6D4;
            --danger: #A35A45;
            --radius: 8px;
            --shadow: 0 4px 18px rgba(61, 106, 79, 0.08);
            --shadow-hover: 0 8px 22px rgba(61, 106, 79, 0.12);
            --serif: "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN", "Songti SC", "STSong", serif;
            --sans: "Noto Sans SC", "Source Han Sans SC", "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "Inter", ui-sans-serif, system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--sans);
            background-color: var(--paper);
            background-image:
                radial-gradient(ellipse at 12% 0%, rgba(216, 228, 220, 0.55), transparent 42%),
                radial-gradient(ellipse at 92% 100%, rgba(138, 109, 75, 0.08), transparent 46%);
            color: var(--ink);
            overflow: hidden;
        }

        #header,
        #container {
            position: relative;
            z-index: 1;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
            padding: 14px 28px;
            background: rgba(252, 250, 245, 0.92);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 0 rgba(216, 228, 220, 0.8);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-mark {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            color: var(--pine);
        }

        #header h1 {
            margin: 0;
            color: var(--pine);
            font-family: var(--serif);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.35;
        }

        #header .subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-family: var(--sans);
            font-size: 12px;
            line-height: 1.4;
        }

        #status {
            flex-shrink: 0;
            padding: 6px 12px;
            color: var(--pine);
            background: var(--moss);
            border: 1px solid rgba(61, 106, 79, 0.16);
            border-radius: 999px;
            font-family: var(--mono);
            font-size: 12px;
        }

        #container {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr) 300px;
            gap: 16px;
            height: calc(100vh - 72px);
            padding: 16px;
        }

        .panel,
        #graph-container {
            min-height: 0;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        #chat-panel,
        #sidebar {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 16px 12px;
            color: var(--pine);
            font-family: var(--serif);
            font-size: 17px;
            font-weight: 700;
            border-bottom: 1px solid var(--line);
        }

        .panel-head svg,
        .section-title svg {
            flex: 0 0 16px;
            width: 16px;
            height: 16px;
            color: var(--ochre);
        }

        #chat-thread {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-thread::-webkit-scrollbar,
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }

        #chat-thread::-webkit-scrollbar-thumb,
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(61, 106, 79, 0.28);
            border-radius: 4px;
        }

        .chat-welcome {
            margin: auto 0;
            padding: 8px 4px 24px;
            color: var(--muted);
            text-align: center;
        }

        .chat-welcome strong {
            display: block;
            margin-bottom: 8px;
            color: var(--pine);
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 700;
        }

        .chat-welcome p {
            font-size: 13px;
            line-height: 1.7;
        }

        .msg {
            max-width: 100%;
            animation: fade-up 0.28s ease;
        }

        .msg-user {
            align-self: flex-end;
            max-width: 92%;
        }

        .msg-ai {
            align-self: stretch;
        }

        .msg-label {
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.04em;
        }

        .bubble {
            padding: 12px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.75;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .msg-user .bubble {
            color: var(--ink);
            background: var(--moss);
            border: 1px solid rgba(61, 106, 79, 0.14);
        }

        .msg-ai .bubble {
            color: var(--ink);
            background: #FFFEF9;
            border: 1px solid var(--line);
        }

        .entity-mark {
            background: var(--highlight);
            border-radius: 3px;
            padding: 0.05em 0.28em;
            color: inherit;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .trace-block {
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(252, 250, 245, 0.9);
        }

        .trace-block summary {
            cursor: pointer;
            list-style: none;
            padding: 9px 12px;
            color: var(--pine);
            font-size: 12px;
            font-weight: 600;
        }

        .trace-block summary::-webkit-details-marker {
            display: none;
        }

        .trace-block summary::before {
            content: "▸";
            display: inline-block;
            margin-right: 6px;
            color: var(--ochre);
        }

        .trace-block[open] summary::before {
            content: "▾";
        }

        .trace-body {
            display: grid;
            gap: 8px;
            padding: 0 12px 12px;
        }

        .source-card,
        .stat,
        .legend-item {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .source-card {
            padding: 10px 12px;
        }

        .source-card:hover,
        .section:hover,
        .legend-item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }

        .source-meta {
            margin-bottom: 6px;
            color: var(--ochre);
            font-family: var(--mono);
            font-size: 11px;
        }

        .source-text {
            color: var(--ink);
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--highlight);
            color: var(--ink);
            font-size: 11px;
        }

        .composer {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--line);
            background: rgba(252, 250, 245, 0.72);
        }

        #question-input {
            width: 100%;
            min-height: 88px;
            margin-bottom: 10px;
            padding: 11px 12px;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }

        #question-input:focus,
        .retrieval-selector select:focus {
            outline: 2px solid rgba(61, 106, 79, 0.18);
            border-color: var(--pine);
        }

        #ask-button {
            display: flex;
            width: 100%;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            color: #fff;
            background: var(--pine);
            border: none;
            border-radius: var(--radius);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        #ask-button:hover {
            background: var(--pine-hover);
            box-shadow: 0 8px 16px rgba(61, 106, 79, 0.22);
            transform: translateY(-1px);
        }

        #ask-button:disabled {
            background: #8AA090;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .quick-prompt {
            padding: 5px 9px;
            color: var(--pine);
            background: rgba(216, 228, 220, 0.7);
            border: 1px solid rgba(61, 106, 79, 0.16);
            border-radius: 999px;
            font-family: var(--sans);
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .quick-prompt:hover {
            color: #fff;
            background: var(--pine);
        }

        #sidebar {
            padding: 12px;
            overflow-y: auto;
            gap: 12px;
        }

        .section {
            padding: 14px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--pine);
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            list-style: none;
        }

        .section-title::-webkit-details-marker {
            display: none;
        }

        .section-body {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .retrieval-selector label,
        .field-label,
        .stat-label,
        .legend-label,
        .hint-text {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .retrieval-selector label {
            display: block;
            margin-bottom: 6px;
        }

        .retrieval-selector select {
            width: 100%;
            padding: 9px 10px;
            color: var(--ink);
            background: #FFFEF9;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-family: var(--sans);
            font-size: 13px;
            cursor: pointer;
        }

        .retrieval-selector option {
            color: var(--ink);
            background: var(--paper);
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 10px;
        }

        .stat-value {
            color: var(--pine);
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            cursor: default;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(51, 51, 51, 0.12);
        }

        .legend-count {
            margin-left: auto;
            color: var(--muted);
            background: var(--moss);
            padding: 2px 8px;
            border-radius: 999px;
            font-family: var(--mono);
            font-size: 11px;
        }

        #graph-container {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 18% 12%, rgba(216, 228, 220, 0.5), transparent 42%),
                radial-gradient(ellipse at 86% 88%, rgba(138, 109, 75, 0.09), transparent 40%),
                linear-gradient(180deg, #F8F4EB 0%, #FCFAF5 100%);
        }

        #graph-container::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(61, 106, 79, 0.025) 3px, rgba(61, 106, 79, 0.025) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(138, 109, 75, 0.02) 5px, rgba(138, 109, 75, 0.02) 6px);
        }

        .canvas-deco {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .vein {
            position: absolute;
            width: 180px;
            height: 180px;
            opacity: 0.16;
            color: var(--pine);
        }

        .vein-tl { top: 8px; left: 8px; }
        .vein-br { right: 10px; bottom: 8px; transform: rotate(180deg); }

        .canvas-caption {
            position: absolute;
            right: 18px;
            bottom: 14px;
            z-index: 2;
            color: rgba(61, 106, 79, 0.42);
            font-family: var(--serif);
            font-size: 12px;
            pointer-events: none;
        }

        #loading,
        #empty-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            text-align: center;
            pointer-events: none;
        }

        #loading {
            display: none;
            color: var(--pine);
            font-size: 16px;
        }

        #empty-hint {
            color: rgba(51, 51, 51, 0.62);
            font-family: var(--serif);
            font-size: 16px;
            line-height: 1.8;
            padding: 0 24px;
        }

        #details-panel,
        #graph-tooltip {
            position: absolute;
            z-index: 12;
            max-width: 280px;
            padding: 12px 14px;
            color: var(--ink);
            background: rgba(255, 254, 249, 0.96);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 13px;
            line-height: 1.6;
        }

        #details-panel {
            top: 64px;
            left: 16px;
            display: none;
        }

        #graph-tooltip {
            display: none;
            pointer-events: none;
        }

        #graph-tooltip.visible,
        #details-panel.visible {
            display: block;
        }

        .detail-title {
            color: var(--pine);
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 700;
        }

        .detail-type {
            margin: 4px 0 8px;
            color: var(--ochre);
            font-size: 12px;
        }

        #graph {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #graph:active {
            cursor: grabbing;
        }

        .zoom-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            color: var(--pine);
            background: rgba(255, 254, 249, 0.94);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .zoom-btn:hover {
            color: #fff;
            background: var(--pine);
            transform: translateY(-1px);
        }

        .node {
            cursor: pointer;
        }

        .node circle {
            stroke: #FCFAF5;
            stroke-width: 2px;
            filter: drop-shadow(0 2px 3px rgba(61, 106, 79, 0.18));
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }

        .node text {
            font-size: 11px;
            fill: var(--ink);
            text-anchor: middle;
            pointer-events: none;
            font-family: var(--sans);
        }

        .node:hover circle {
            stroke: var(--ochre);
            stroke-width: 3px;
        }

        .node.highlighted circle,
        .link.highlighted {
            stroke: var(--ochre);
            filter: drop-shadow(0 0 6px rgba(138, 109, 75, 0.35));
        }

        .link {
            stroke: rgba(61, 106, 79, 0.38);
            stroke-width: 1.5px;
            fill: none;
        }

        .link-label {
            font-size: 9px;
            fill: rgba(51, 51, 51, 0.55);
            text-anchor: middle;
            pointer-events: none;
            font-family: var(--sans);
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(61, 106, 79, 0.2);
            border-radius: 50%;
            border-top-color: var(--pine);
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        .error-text {
            color: var(--danger);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1100px) {
            body {
                overflow: auto;
            }

            #container {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 72px);
            }

            #chat-panel,
            #sidebar {
                width: 100%;
                max-height: none;
            }

            #chat-panel {
                min-height: 420px;
            }

            #graph-container {
                height: 62vh;
                min-height: 460px;
            }
        }

        @media (max-width: 720px) {
            #header {
                padding: 12px 16px;
            }

            #header h1 {
                font-size: 16px;
            }

            #container {
                padding: 10px;
                gap: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
                <circle cx="20" cy="20" r="18.5" fill="#D8E4DC" stroke="#3D6A4F" stroke-width="1.2"/>
                <path d="M20 8 C21 16 21 24 20 33" fill="none" stroke="#3D6A4F" stroke-width="1.4"/>
                <path d="M20 14 C14 16 11 21 12 26" fill="none" stroke="#3D6A4F" stroke-width="1.1"/>
                <path d="M20 14 C26 16 29 21 28 26" fill="none" stroke="#3D6A4F" stroke-width="1.1"/>
                <path d="M20 20 C15 21 13 24 13 28" fill="none" stroke="#3D6A4F" stroke-width="0.9"/>
                <path d="M20 20 C25 21 27 24 27 28" fill="none" stroke="#3D6A4F" stroke-width="0.9"/>
            </svg>
            <div>
                <h1>基于中草药知识图谱的 Graph-RAG 问答系统</h1>
                <div class="subtitle">本草知识图谱 · 证据优先的问答与关系探索</div>
            </div>
        </div>
        <div id="status">连接中...</div>
    </div>

    <div id="container">
        <section id="chat-panel" class="panel" aria-label="问答对话">
            <div class="panel-head">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M3 3.5h10v7.2H7.2L4.2 13V10.7H3z" fill="none" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                问答对话
            </div>
            <div id="chat-thread">
                <div class="chat-welcome" id="chat-welcome">
                    <strong>从一味药问起</strong>
                    <p>在此提问中药性味、功效、方剂或病症关系。<br>系统将检索知识图谱，并在右侧画布展开对应子图。</p>
                </div>
            </div>
            <div class="composer">
                <textarea id="question-input" placeholder="例如：人参的性味、归经和功效是什么？"></textarea>
                <button id="ask-button" type="button">提问</button>
                <div class="quick-prompts" aria-label="常用问题">
                    <button type="button" class="quick-prompt" data-question="人参的性味、归经和功效是什么？">人参 · 属性</button>
                    <button type="button" class="quick-prompt" data-question="哪些中药具有大补元气的功效？">功效 · 反查</button>
                    <button type="button" class="quick-prompt" data-question="比较人参和黄芪的功效异同。">人参 / 黄芪</button>
                </div>
            </div>
        </section>

        <div id="graph-container">
            <div class="canvas-deco" aria-hidden="true">
                <svg class="vein vein-tl" viewBox="0 0 180 180">
                    <path d="M18 16 C40 40 48 92 42 164" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M28 40 C12 52 8 78 14 104" fill="none" stroke="currentColor" stroke-width="0.9"/>
                    <path d="M34 70 C58 78 72 96 78 126" fill="none" stroke="currentColor" stroke-width="0.9"/>
                    <path d="M32 98 C18 112 16 132 22 148" fill="none" stroke="currentColor" stroke-width="0.8"/>
                </svg>
                <svg class="vein vein-br" viewBox="0 0 180 180">
                    <path d="M18 16 C40 40 48 92 42 164" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M28 40 C12 52 8 78 14 104" fill="none" stroke="currentColor" stroke-width="0.9"/>
                    <path d="M34 70 C58 78 72 96 78 126" fill="none" stroke="currentColor" stroke-width="0.9"/>
                </svg>
            </div>
            <div id="loading">加载中...</div>
            <div id="empty-hint">暂不加载全图，避免卡顿<br>在左侧提问，让本草关系在此显形</div>
            <div id="details-panel"></div>
            <div id="graph-tooltip"></div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in" title="放大">+</button>
                <button class="zoom-btn" id="zoom-reset" title="重置">⊙</button>
                <button class="zoom-btn" id="zoom-out" title="缩小">−</button>
            </div>
            <div class="canvas-caption">知识图谱可视化</div>
            <svg id="graph"></svg>
        </div>

        <aside id="sidebar" class="panel" aria-label="检索与图谱设置">
            <details class="section" open>
                <summary class="section-title">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="6" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <circle cx="11" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 7.2 L9.4 8.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
                    </svg>
                    检索参数
                </summary>
                <div class="section-body">
                    <div class="retrieval-selector">
                        <label for="retrieval-method">检索模式</label>
                        <select id="retrieval-method">
                            <option value="auto" selected>自动意图路由（推荐）</option>
                            <option value="kg_v2">证据知识图谱 v2（自动路由兼容入口）</option>
                            <option value="keyword_graph">全文检索 + 受限图谱</option>
                            <option value="vector">向量检索</option>
                            <option value="vector_cypher">向量+图遍历</option>
                            <option value="hybrid">混合检索</option>
                            <option value="hybrid_cypher">混合+图遍历</option>
                        </select>
                    </div>
                    <p class="hint-text">检索数量、图结构融合与置信度路由均由所选模式在服务端执行，前端仅切换检索路径。</p>
                </div>
            </details>

            <details class="section" open>
                <summary class="section-title">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 2.5 C9.5 5.5 9.5 9 8 13.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 5.5 C5.5 6.5 4.2 8.8 4.5 11" fill="none" stroke="currentColor" stroke-width="1.1"/>
                        <path d="M8 5.5 C10.5 6.5 11.8 8.8 11.5 11" fill="none" stroke="currentColor" stroke-width="1.1"/>
                    </svg>
                    图谱设置
                </summary>
                <div class="section-body">
                    <div id="stats">
                        <div class="stat">
                            <span class="stat-label">实体数量</span>
                            <span class="stat-value" id="node-count">-</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">关系数量</span>
                            <span class="stat-value" id="edge-count">-</span>
                        </div>
                    </div>
                    <div>
                        <div class="field-label" style="margin-bottom: 8px;">实体类型</div>
                        <div class="legend" id="legend"></div>
                        <p class="hint-text" style="margin-top: 8px;">启动显示全库统计；提问后切换为当前子图类型。药材墨绿，病症赭石，方剂浅苔绿。</p>
                    </div>
                </div>
            </details>
        </aside>
    </div>

    <script>
        const API_BASE = '/api';
        const MAX_SUBGRAPH_NODES = 80;

        let graphData = { nodes: [], edges: [] };
        let svg, g, simulation, link, node, zoom;
        let nodeDragged = false;

        const colorScheme = {
            '中药': '#3D6A4F',
            '功效': '#5E7F6C',
            '主治': '#8A6D4B',
            '性味': '#4F735F',
            '归经': '#3D6A4F',
            '用法用量': '#8A6D4B',
            '禁忌': '#7A5C40',
            '配伍': '#3D6A4F',
            '药材来源': '#3D6A4F',
            '炮制': '#5C7A66',
            '化学成分': '#4A6E58',
            '方剂': '#D8E4DC',
            '典籍': '#8A6D4B',
            '人物': '#8A6D4B',
            '概念': '#7A8A80',
            'default': '#7A8A80'
        };

        function getNodeColor(type) {
            return colorScheme[type] || colorScheme['default'];
        }

        function setEmptyHintVisible(visible) {
            const hint = document.getElementById('empty-hint');
            if (hint) hint.style.display = visible ? 'block' : 'none';
        }

        function cloneGraphPayload(data) {
            const nodes = (data.nodes || []).map(n => ({
                id: n.id,
                label: n.label || n.name || 'unknown',
                type: n.type || '概念'
            }));
            const nodeIds = new Set(nodes.map(n => n.id));
            const edges = (data.edges || [])
                .map(e => ({
                    source: typeof e.source === 'object' ? e.source.id : e.source,
                    target: typeof e.target === 'object' ? e.target.id : e.target,
                    type: e.type || '相关'
                }))
                .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
            return { nodes, edges };
        }

        function limitGraph(data) {
            if (data.nodes.length <= MAX_SUBGRAPH_NODES) return data;
            const keep = new Set(data.nodes.slice(0, MAX_SUBGRAPH_NODES).map(n => n.id));
            return {
                nodes: data.nodes.filter(n => keep.has(n.id)),
                edges: data.edges.filter(e => keep.has(e.source) && keep.has(e.target))
            };
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function highlightEntities(text, nodes) {
            let html = escapeHtml(text);
            const labels = [...new Set((nodes || []).map(n => n.label || n.name).filter(Boolean))]
                .filter(label => label.length >= 2)
                .sort((a, b) => b.length - a.length);
            labels.forEach((label) => {
                const token = escapeHtml(label);
                html = html.split(token).join(`<mark class="entity-mark">${token}</mark>`);
            });
            return html.replace(/\n/g, '<br>');
        }

        function pageLabel(source) {
            if (source.page_start == null) return '页码未标注';
            return source.page_start === source.page_end
                ? `第 ${source.page_start} 页`
                : `第 ${source.page_start}-${source.page_end} 页`;
        }

        function renderProvenance(data, subgraph) {
            const sources = data.sources || [];
            const nodes = subgraph.nodes || [];
            const intent = data.intent ? `<div class="source-meta">检索意图 ${escapeHtml(data.intent)}</div>` : '';
            const warnings = (data.warnings || []).length
                ? `<div class="source-meta">${escapeHtml(data.warnings.join('；'))}</div>`
                : '';
            const confidence = data.trace && data.trace.route && data.trace.route.confidence != null
                ? `<div class="source-meta">路由置信度 ${escapeHtml(data.trace.route.confidence)}</div>`
                : '';
            const chips = nodes.slice(0, 18).map(n => `<span class="chip">${escapeHtml(n.label || n.name)}</span>`).join('');
            const sourceCards = sources.length
                ? sources.map((source) => {
                    const quote = source.evidence_quote || source.text || '';
                    const score = source.score != null ? ` · 分数 ${escapeHtml(source.score)}` : '';
                    const terms = (source.matched_terms || []).filter(Boolean);
                    return `
                        <article class="source-card">
                            <div class="source-meta">教材原文 · ${escapeHtml(pageLabel(source))}${score}</div>
                            <p class="source-text">${quote ? escapeHtml(quote) : (terms.length ? `命中词：${escapeHtml(terms.join('、'))}` : '该来源未返回原文片段，仅保留页码溯源。')}</p>
                        </article>
                    `;
                }).join('')
                : '<article class="source-card"><p class="source-text">本次回答未返回可展开的原文片段。</p></article>';

            return `
                <details class="trace-block">
                    <summary>Graph 检索溯源 · 子图 ${nodes.length} 个实体 / ${(subgraph.edges || []).length} 条关系</summary>
                    <div class="trace-body">
                        ${intent}${confidence}${warnings}
                        ${chips ? `<div class="chip-row">${chips}</div>` : ''}
                        ${sourceCards}
                    </div>
                </details>
            `;
        }

        function hideWelcome() {
            const welcome = document.getElementById('chat-welcome');
            if (welcome) welcome.remove();
        }

        function appendMessage(role, html) {
            hideWelcome();
            const thread = document.getElementById('chat-thread');
            const wrap = document.createElement('div');
            wrap.className = `msg msg-${role}`;
            wrap.innerHTML = html;
            thread.appendChild(wrap);
            thread.scrollTop = thread.scrollHeight;
            return wrap;
        }

        function initGraph() {
            svg = d3.select('#graph');
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            svg.attr('width', width).attr('height', height);

            svg.selectAll('*').remove();
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '-0 -5 10 10')
                .attr('refX', 18)
                .attr('refY', 0)
                .attr('orient', 'auto')
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .append('path')
                .attr('d', 'M 0,-5 L 10,0 L 0,5')
                .attr('fill', '#3D6A4F');

            zoom = d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);
            g = svg.append('g');

            simulation = d3.forceSimulation()
                .force('link', d3.forceLink().id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            document.getElementById('zoom-in').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 1.3);
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                svg.transition().call(zoom.scaleBy, 0.7);
            });

            document.getElementById('zoom-reset').addEventListener('click', () => {
                svg.transition().call(zoom.transform, d3.zoomIdentity);
            });
        }

        function resizeGraph() {
            if (!svg || !simulation) return;
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            svg.attr('width', width).attr('height', height);
            simulation.force('center', d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.25).restart();
        }

        function showTooltip(event, d) {
            const tip = document.getElementById('graph-tooltip');
            const container = document.getElementById('graph-container');
            const rect = container.getBoundingClientRect();
            tip.innerHTML = `<div class="detail-title">${escapeHtml(d.label)}</div><div class="detail-type">${escapeHtml(d.type)}</div>`;
            tip.classList.add('visible');
            const x = event.clientX - rect.left + 14;
            const y = event.clientY - rect.top + 14;
            tip.style.left = `${Math.min(x, rect.width - 200)}px`;
            tip.style.top = `${Math.min(y, rect.height - 80)}px`;
        }

        function hideTooltip() {
            document.getElementById('graph-tooltip').classList.remove('visible');
        }

        function showNodeDetails(d) {
            const panel = document.getElementById('details-panel');
            const related = graphData.edges
                .map(e => {
                    const sourceId = typeof e.source === 'object' ? e.source.id : e.source;
                    const targetId = typeof e.target === 'object' ? e.target.id : e.target;
                    const sourceNode = graphData.nodes.find(n => n.id === sourceId);
                    const targetNode = graphData.nodes.find(n => n.id === targetId);
                    if (sourceId !== d.id && targetId !== d.id) return null;
                    const other = sourceId === d.id ? targetNode : sourceNode;
                    return `${escapeHtml(e.type)} → ${escapeHtml((other && other.label) || '未命名')}`;
                })
                .filter(Boolean)
                .slice(0, 8);
            panel.innerHTML = `
                <div class="detail-title">${escapeHtml(d.label)}</div>
                <div class="detail-type">${escapeHtml(d.type)}</div>
                ${related.length ? related.map(item => `<div>${item}</div>`).join('') : '<div class="hint-text">当前子图中暂无相邻关系</div>'}
            `;
            panel.classList.add('visible');
            panel.style.display = 'block';

            g.selectAll('.node').classed('highlighted', n => n.id === d.id);
            g.selectAll('.link').classed('highlighted', e => {
                const sourceId = typeof e.source === 'object' ? e.source.id : e.source;
                const targetId = typeof e.target === 'object' ? e.target.id : e.target;
                return sourceId === d.id || targetId === d.id;
            });
        }

        function updateGraph(data) {
            const prepared = limitGraph(cloneGraphPayload(data || { nodes: [], edges: [] }));
            graphData = prepared;
            setEmptyHintVisible(prepared.nodes.length === 0);
            document.getElementById('details-panel').style.display = 'none';
            document.getElementById('details-panel').classList.remove('visible');
            hideTooltip();

            link = g.selectAll('.link')
                .data(prepared.edges, d => `${d.source}-${d.target}-${d.type}`)
                .join('path')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrowhead)');

            const linkLabel = g.selectAll('.link-label')
                .data(prepared.edges, d => `${d.source}-${d.target}-${d.type}`)
                .join('text')
                .attr('class', 'link-label')
                .text(d => d.type);

            const nodeGroup = g.selectAll('.node')
                .data(prepared.nodes, d => d.id)
                .join('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragStarted)
                    .on('drag', dragged)
                    .on('end', dragEnded));

            nodeGroup.selectAll('*').remove();

            nodeGroup.append('circle')
                .attr('r', 8)
                .attr('fill', d => getNodeColor(d.type))
                .attr('stroke', d => d.type === '方剂' ? '#3D6A4F' : '#FCFAF5');

            nodeGroup.append('text')
                .attr('dy', 20)
                .text(d => d.label);

            nodeGroup
                .on('mouseenter', (event, d) => showTooltip(event, d))
                .on('mousemove', (event, d) => showTooltip(event, d))
                .on('mouseleave', hideTooltip)
                .on('click', (event, d) => {
                    if (nodeDragged) return;
                    event.stopPropagation();
                    showNodeDetails(d);
                });

            node = nodeGroup;

            simulation.nodes(prepared.nodes);
            simulation.force('link').links(prepared.edges);
            simulation.alpha(1).restart();

            simulation.on('tick', () => {
                link.attr('d', d => {
                    const dx = d.target.x - d.source.x;
                    const dy = d.target.y - d.source.y;
                    const dr = Math.sqrt(dx * dx + dy * dy) || 1;
                    return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
                });

                linkLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);

                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });

            updateLegend(prepared.nodes);
        }

        function updateLegend(nodes) {
            const typeCounts = {};
            nodes.forEach(nodeItem => {
                typeCounts[nodeItem.type] = (typeCounts[nodeItem.type] || 0) + 1;
            });

            const legend = document.getElementById('legend');
            legend.innerHTML = '';

            Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `
                    <div class="legend-color" style="background: ${getNodeColor(type)}"></div>
                    <div class="legend-label">${type}</div>
                    <div class="legend-count">${count}</div>
                `;
                legend.appendChild(item);
            });
        }

        function updateLegendFromStats(nodesByType) {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';
            Object.entries(nodesByType || {})
                .sort((a, b) => b[1] - a[1])
                .forEach(([type, count]) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.innerHTML = `
                        <div class="legend-color" style="background: ${getNodeColor(type)}"></div>
                        <div class="legend-label">${type}</div>
                        <div class="legend-count">${count}</div>
                    `;
                    legend.appendChild(item);
                });
        }

        function dragStarted(event, d) {
            nodeDragged = false;
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            nodeDragged = true;
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('status').textContent = data.status === 'ok' ? '已连接' : '连接失败';
                document.getElementById('status').style.color = data.status === 'ok' ? '#3D6A4F' : '#A35A45';
            } catch (error) {
                document.getElementById('status').textContent = '无法连接';
                document.getElementById('status').style.color = '#A35A45';
            }
        }

        async function loadStats() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').textContent = '加载图谱统计...';
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '统计接口失败');

                document.getElementById('node-count').textContent = data.total_nodes ?? '-';
                document.getElementById('edge-count').textContent = data.total_relationships ?? '-';
                updateLegendFromStats(data.nodes_by_type);
                setEmptyHintVisible(true);
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('loading').textContent = '统计加载失败';
                document.getElementById('node-count').textContent = '-';
                document.getElementById('edge-count').textContent = '-';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        document.getElementById('ask-button').addEventListener('click', async () => {
            const question = document.getElementById('question-input').value.trim();
            const method = document.getElementById('retrieval-method').value;

            if (!question) return;

            const askButton = document.getElementById('ask-button');

            askButton.disabled = true;
            askButton.innerHTML = '<span class="loading-spinner"></span> 思考中...';

            appendMessage('user', `
                <div class="msg-label">提问</div>
                <div class="bubble">${escapeHtml(question)}</div>
            `);
            const aiMsg = appendMessage('ai', `
                <div class="msg-label">回答</div>
                <div class="bubble"><span class="loading-spinner"></span> 正在检索知识图谱...</div>
            `);

            try {
                const response = await fetch(`${API_BASE}/graphrag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        method: method
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const methodLabel = {
                        'auto': `自动路由${data.intent ? ` · ${data.intent}` : ''}`,
                        'kg_v2': `证据图谱${data.intent ? ` · ${data.intent}` : ''}`,
                        'keyword_graph': 'BM25+受限图谱（推荐）',
                        'vector': '向量检索',
                        'vector_cypher': '向量+图遍历',
                        'hybrid': '混合检索',
                        'hybrid_cypher': '混合+图遍历'
                    }[data.method] || data.method;

                    const subgraph = data.subgraph || { nodes: [], edges: [] };
                    const nodeCount = subgraph.nodes ? subgraph.nodes.length : 0;
                    const edgeCount = subgraph.edges ? subgraph.edges.length : 0;

                    aiMsg.innerHTML = `
                        <div class="msg-label">回答 · ${escapeHtml(methodLabel)}</div>
                        <div class="bubble">${highlightEntities(data.answer || '', subgraph.nodes || [])}</div>
                        ${renderProvenance(data, subgraph)}
                        <div class="source-meta" style="margin-top:8px;">画布展示相关子图：${nodeCount} 个节点，${edgeCount} 条关系</div>
                    `;

                    if (nodeCount > 0) {
                        updateGraph(subgraph);
                    } else {
                        updateGraph({ nodes: [], edges: [] });
                    }
                } else {
                    aiMsg.innerHTML = `<div class="bubble error-text">错误: ${escapeHtml(data.error || '请求失败')}</div>`;
                }
            } catch (error) {
                console.error('Error asking question:', error);
                aiMsg.innerHTML = `<div class="bubble error-text">错误: ${escapeHtml(error.message)}</div>`;
            } finally {
                askButton.disabled = false;
                askButton.textContent = '提问';
                const thread = document.getElementById('chat-thread');
                thread.scrollTop = thread.scrollHeight;
            }
        });

        document.getElementById('question-input').addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('ask-button').click();
            }
        });

        document.querySelectorAll('.quick-prompt').forEach((prompt) => {
            prompt.addEventListener('click', () => {
                const input = document.getElementById('question-input');
                input.value = prompt.dataset.question || '';
                input.focus();
            });
        });

        document.getElementById('graph-container').addEventListener('click', (event) => {
            if (event.target.closest('.node') || event.target.closest('.zoom-controls')) return;
            const panel = document.getElementById('details-panel');
            panel.style.display = 'none';
            panel.classList.remove('visible');
            if (g) {
                g.selectAll('.node').classed('highlighted', false);
                g.selectAll('.link').classed('highlighted', false);
            }
        });

        window.addEventListener('resize', resizeGraph);

        initGraph();
        checkHealth();
        loadStats();
        setInterval(checkHealth, 10000);
    </script>
</body>
</html>
