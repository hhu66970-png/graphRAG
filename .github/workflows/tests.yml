name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check frontend and launcher runtimes
        run: |
          node --check frontend/assets/app.js
          pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          echo "PWSH_EXECUTABLE=$(command -v pwsh)" >> "$GITHUB_ENV"
      - name: Run offline tests
        run: python -m pytest -m "not integration"
      - name: Validate evaluation datasets
        run: |
          python scripts/eval_retrieval.py --validate-only
          python scripts/eval_high_risk.py --validate-only
          python scripts/check_ppt_demo.py --validate-only

  offline-windows:
    name: Windows venv / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install in a real Windows virtual environment
        run: |
          python -m venv .venv-ci
          & .\.venv-ci\Scripts\python.exe -m pip install -r requirements/dev.txt
      - name: Check frontend and launcher runtimes
        run: |
          node --check frontend/assets/app.js
          "PWSH_EXECUTABLE=$((Get-Command pwsh).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run offline tests through the venv redirector
        run: '& .\.venv-ci\Scripts\python.exe -m pytest -m "not integration"'
      - name: Validate evaluation datasets
        run: |
          & .\.venv-ci\Scripts\python.exe scripts/eval_retrieval.py --validate-only
          & .\.venv-ci\Scripts\python.exe scripts/eval_high_risk.py --validate-only
          & .\.venv-ci\Scripts\python.exe scripts/check_ppt_demo.py --validate-only

  neo4j:
    name: Neo4j 5.26 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-start-period 30s
          --health-retries 12
    env:
      NEO4J_TEST_URL: bolt://127.0.0.1:17687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: ci-test-password
      NEO4J_TEST_DB: neo4j
      ALLOW_DESTRUCTIVE_TESTS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt "neo4j-graphrag>=1.19,<2"
      - name: Verify disposable database connection
        run: |
          python - <<'PY'
          import os
          from neo4j import GraphDatabase
          with GraphDatabase.driver(
              os.environ["NEO4J_TEST_URL"],
              auth=(os.environ["NEO4J_TEST_USER"], os.environ["NEO4J_TEST_PASSWORD"]),
          ) as driver:
              driver.verify_connectivity()
          PY
      - name: Run synthetic-data integration tests
        run: >-
          python -m pytest -m integration
          tests/kg/test_storage_integration.py
          tests/scripts/test_kg_bundle.py
          tests/test_legacy_write_safety.py
          tests/test_neo4j_integration.py
          tests/test_retrieval.py
